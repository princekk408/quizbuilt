<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#06120E">
<title>QuizBuilt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://xjepnbxlbjyxgpxavwtt.supabase.co">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Young+Serif&display=swap"></noscript>
<style>
:root{
  --serif:'Young Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#0A0C18;--s1:#12152A;--s2:#171B34;--s3:#202544;
  --line:rgba(228,231,246,.10);--line2:rgba(228,231,246,.20);
  --tx:#EDEEF8;--mut:#9EA2C4;--dim:#6E729A;
  --brass:#DDB868;--brass2:#BD9646;--onb:#221604;
  --ok:#4FD4A8;--bad:#F2837A;--warn:#F0B255;--info:#8DB4F0;
  --shadow:0 14px 44px rgba(0,0,6,.55);--grain:.05;
}
[data-theme=light]{
  color-scheme:light;
  --bg:#F6F8FC;--s1:#FFFFFF;--s2:#FFFFFF;--s3:#EEF3FC;
  --line:rgba(20,35,70,.10);--line2:rgba(20,35,70,.18);
  --tx:#131A2C;--mut:#5C6785;--dim:#8891AC;
  --brass:#2F6FED;--brass2:#1E56D6;--onb:#FFFFFF;
  --ok:#0E9F6E;--bad:#E23B3B;--warn:#C98A0A;--info:#2F6FED;
  --shadow:0 10px 30px rgba(20,35,70,.10);--grain:0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--tx);background:var(--bg);min-height:100vh;overflow-x:hidden;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body.noscroll{overflow:hidden}
body.noselect,body.noselect *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.noselect input,body.noselect textarea{-webkit-user-select:text;user-select:text}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.ic{flex:none;vertical-align:middle}
#app{position:relative;z-index:1}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px calc(120px + env(safe-area-inset-bottom))}
.wrap.narrow{max-width:460px}
.h1{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.15;letter-spacing:-.01em}
.h2{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.25}
.h3{font-weight:700;font-size:16px}
.mut{color:var(--mut)}.dim{color:var(--dim)}.sm{font-size:13px}.xs{font-size:12px}
.b{font-weight:700}.brass{color:var(--brass)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warnc{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px}.row.wrapf{flex-wrap:wrap}.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}.grow{flex:1;min-width:0}
.gap{margin-top:16px}.gap2{margin-top:26px}.gap0{margin-top:8px}
.center{text-align:center}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* top bar + nav */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:21px}
.brand svg{width:30px;height:30px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--s1)}
.me-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--s1);font-weight:600;font-size:13px;max-width:150px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brass);color:var(--onb);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.avatar.lg{width:64px;height:64px;font-size:26px;font-family:var(--serif)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;width:min(440px,calc(100% - 24px));display:flex;justify-content:space-around;align-items:center;padding:8px 6px;background:var(--s1);border:1px solid var(--line2);border-radius:26px;box-shadow:var(--shadow)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--dim);padding:4px 10px;border-radius:14px;min-width:58px}
.nav a.on{color:var(--brass)}
.nav a.mk{background:var(--brass);color:var(--onb);width:54px;height:54px;min-width:54px;border-radius:18px;justify-content:center;margin-top:-22px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
body.taking .top,body.taking .nav{display:none}

/* surfaces */
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.tight{padding:12px}
.card+.card,.card+.gapc{margin-top:12px}
.hero{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:1px solid var(--line2);box-shadow:0 0 0 14px var(--s1),0 0 0 15px var(--line);opacity:.7;pointer-events:none}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec-t .h2{font-size:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--line2);background:var(--s2);min-height:44px;text-align:center}
.btn:active{transform:scale(.98)}
.btn.brass{background:var(--brass);color:var(--onb);border-color:var(--brass)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.solid-bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.big{min-height:54px;font-size:17px;border-radius:14px}

/* forms */
.lbl{display:block;font-weight:600;font-size:13.5px;margin:14px 0 6px}
.hint{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.4}
.inp{width:100%;padding:12px 14px;background:var(--s2);border:1px solid var(--line2);border-radius:10px;font-size:15px;min-height:46px;color:var(--tx)}
.inp::placeholder{color:var(--dim)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.45}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2398AC9F' stroke-width='1.8'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.inp:focus{border-color:var(--brass);outline:none}
.pw{position:relative}.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;color:var(--mut)}
.pw .inp{padding-right:46px}
.err{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:0}
.meter{height:4px;border-radius:4px;background:var(--s3);margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--bad);transition:width .25s,background .25s}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .t{flex:1;min-width:0}.setrow .t b{display:block;font-weight:600;font-size:14.5px}.setrow .t small{display:block;color:var(--dim);font-size:12.5px;line-height:1.35;margin-top:2px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:var(--s3);border:1px solid var(--line2);border-radius:99px;transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:.2s}
.sw input:checked+i{background:var(--brass);border-color:var(--brass)}
.sw input:checked+i::after{transform:translateX(20px);background:var(--onb)}
.sw input:disabled+i{opacity:.4}
.sub{margin:0 0 6px 0;padding:6px 14px 10px;border-left:2px solid var(--brass);background:var(--s2);border-radius:0 12px 12px 0}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--mut)}
.seg button.on{background:var(--brass);color:var(--onb)}

/* chips badges tabs */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line2);font-weight:600;font-size:13.5px;color:var(--mut);background:var(--s1);white-space:nowrap}
.chip.on{background:var(--brass);border-color:var(--brass);color:var(--onb)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:12px;font-weight:700;background:var(--s3);color:var(--mut)}
.badge.gold{background:color-mix(in srgb,var(--brass) 22%,transparent);color:var(--brass)}
.badge.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.badge.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.badge.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:14px}.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;font-weight:700;font-size:14px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab.on{color:var(--brass);border-color:var(--brass)}

/* accordion */
.acc{background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;font-weight:700}
.acc summary::-webkit-details-marker{display:none}
.acc summary .ic{color:var(--brass)}
.acc summary .chev{margin-left:auto;transition:transform .2s;color:var(--dim)}
.acc[open] summary .chev{transform:rotate(180deg)}
.accb{padding:2px 16px 16px}

/* quiz slip card */
.slip{display:block;background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:6px 16px 16px 6px;padding:14px 16px;margin-bottom:10px}
.slip h3{font-family:var(--serif);font-weight:400;font-size:18px;line-height:1.25;margin:6px 0 2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;color:var(--mut);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;color:var(--brass)}
.stat span{font-size:12px;color:var(--mut)}
.empty{text-align:center;padding:34px 18px;color:var(--mut);border:1px dashed var(--line2);border-radius:16px}
.empty .ic{color:var(--dim);margin-bottom:8px}
.tile{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-weight:700}
.tile .ic{color:var(--brass)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}

/* modal / sheet */
.ovl{position:fixed;inset:0;z-index:90;background:rgba(2,8,5,.66);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--s1);border:1px solid var(--line2);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:-8px auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:640px){.ovl{align-items:center}.sheet{border-radius:24px}}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 24px));pointer-events:none}
.toast{background:var(--s3);border:1px solid var(--line2);padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:up .2s}
.toast.bad{border-color:var(--bad);color:var(--bad)}.toast.ok{border-color:var(--ok);color:var(--ok)}
.toast.out{opacity:0;transition:opacity .3s}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--brass);animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:92px;border-radius:14px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}

/* auth */
.auth-hero{text-align:left;padding:26px 4px 8px}
.auth-hero .brand{font-size:26px;margin-bottom:22px}
.auth-hero p{color:var(--mut);margin-top:8px}
.link{color:var(--brass);font-weight:700;cursor:pointer}

/* rich text editor */
.tb{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--s2);border:1px solid var(--line2);border-bottom:0;border-radius:10px 10px 0 0}
.tb button{min-width:34px;height:34px;border-radius:8px;font-weight:800;font-size:14px;display:grid;place-items:center;color:var(--mut)}
.tb button:active{background:var(--s3);color:var(--tx)}
.tb .sp{width:1px;background:var(--line2);margin:4px 2px}
.rt{min-height:64px;padding:12px 14px;background:var(--s2);border:1px solid var(--line2);border-radius:0 0 10px 10px;outline:none;line-height:1.55;word-break:break-word}
.rt.sm{min-height:44px;border-radius:10px}
.rt:focus{border-color:var(--brass)}
.rt:empty::before{content:attr(data-ph);color:var(--dim);pointer-events:none}
.rt img,.qbody img{max-width:100%;border-radius:8px;margin:6px 0}
.rt blockquote,.qbody blockquote{border-left:3px solid var(--brass);padding-left:12px;color:var(--mut);margin:6px 0}
.rt code,.qbody code{font-family:var(--mono);background:var(--s3);padding:1px 5px;border-radius:5px;font-size:.92em}
.rt mark,.qbody mark{background:color-mix(in srgb,var(--brass) 45%,transparent);color:inherit;padding:0 2px;border-radius:3px}
.syms{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:var(--s2);border:1px solid var(--line2);border-top:0}
.syms button{min-width:36px;height:36px;border-radius:8px;background:var(--s3);font-size:16px}
.qc{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.qc.open{border-color:var(--brass)}
.qc .qh{display:flex;align-items:center;gap:10px;padding:12px 14px}
.qn{width:30px;height:30px;border-radius:9px;background:var(--s3);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.qc .qsum{flex:1;min-width:0;font-size:14px;color:var(--mut);cursor:pointer}
.qc .qbodyed{padding:0 14px 16px}
.opt-e{display:flex;align-items:flex-start;gap:8px;margin-top:10px}
.opt-e .ol{width:28px;height:28px;margin-top:8px;border-radius:8px;background:var(--s3);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.ck{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim);margin-top:4px;flex:none;width:44px}
.ck input{width:24px;height:24px;accent-color:var(--brass)}
.kbd{font-family:var(--mono);font-size:12px;background:var(--s3);padding:2px 6px;border-radius:5px}
.pre{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--mut);max-height:230px;overflow:auto}
.pcard{border-left:3px solid var(--info);background:var(--s2);border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:10px}

/* taking a quiz */
.tk{min-height:100vh;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.tk-bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.tk-timer{font-family:var(--mono);font-weight:700;font-size:16px;padding:6px 12px;border-radius:10px;background:var(--s2);border:1px solid var(--line2);min-width:78px;text-align:center}
.tk-timer.low{color:var(--bad);border-color:var(--bad)}
.tk-sets{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 0;scrollbar-width:none}.tk-sets::-webkit-scrollbar{display:none}
.tk-sets button{flex:none;padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut);background:var(--s1);border:1px solid var(--line)}
.tk-sets button.on{background:var(--brass);color:var(--onb);border-color:var(--brass)}
.tk-body{flex:1;padding:14px 14px 130px}
.qbody{font-size:17px;line-height:1.6;margin:10px 0 16px;word-break:break-word}
.qbody p{margin:0 0 8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;background:var(--s1);border:1.5px solid var(--line2);border-radius:12px;font-size:16px;line-height:1.45}
.opt .ol{width:30px;height:30px;border-radius:9px;background:var(--s3);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.opt.multi .ol{border-radius:50%}
.opt.on{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 14%,var(--s1))}
.opt.on .ol{background:var(--brass);color:var(--onb)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--s1))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--s1))}
.opt.dead{opacity:.28;pointer-events:none;text-decoration:line-through}
.tk-foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.tk-foot .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.tk-foot .btn{flex:1}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.pal button{height:44px;border-radius:10px;background:var(--s2);border:1px solid var(--line2);font-weight:700;position:relative}
.pal button.a{background:var(--brass);color:var(--onb);border-color:var(--brass)}
.pal button.cur{outline:2px solid var(--tx);outline-offset:2px}

const OK_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'DEL', 'SUB', 'SUP', 'BR', 'P', 'DIV', 'SPAN', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'CODE', 'PRE', 'HR', 'MARK', 'IMG', 'H3', 'H4', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH']);
const DROP_TAGS = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META', 'SVG', 'MATH', 'FORM', 'INPUT', 'BUTTON', 'TEXTAREA', 'SELECT', 'VIDEO', 'AUDIO', 'CANVAS', 'BASE', 'TEMPLATE']);
function clean(html) {

    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 3) return;
      if (ch.nodeType !== 1) { ch.remove(); return; }
      const tag = ch.tagName;
      if (DROP_TAGS.has(tag)) { ch.remove(); return; }
      if (!OK_TAGS.has(tag)) { walk(ch); ch.replaceWith(...ch.childNodes); return; }
      [...ch.attributes].forEach(a => {
        const n = a.name.toLowerCase();
        if (tag === 'IMG' && n === 'src' && /^https:\/\//i.test(a.value)) return;
        if (tag === 'IMG' && n === 'alt') return;
        ch.removeAttribute(a.name);
      });
      if (tag === 'IMG') {

        ch.setAttribute('loading', 'lazy'); ch.setAttribute('referrerpolicy', 'no-referrer');
      }

    });

}
const textOf = html => { const d = document.createElement('div'); d.innerHTML = clean(html); return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
const snippet = (html, n = 70) => { const t = textOf(html); return t.length > n ? t.slice(0, n) + '…' : (t || '(empty)'); };
/* html -> plain text using ^ and _ notation (for text export) */
function htmlToPlain(html) {
  let h = clean(html || '');
  h = h.replace(/<sup>(.*?)<\/sup>/gi, (m, x) => '^' + (/^[A-Za-z0-9+\-]+$/.test(x) ? x : '{' + x + '}'))
    .replace(/<sub>(.*?)<\/sub>/gi, (m, x) => '_' + (/^[A-Za-z0-9]+$/.test(x) ? x : '{' + x + '}'))
    .replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|blockquote)>/gi, '\n').replace(/<img[^>]*>/gi, '[image]');
  const d = document.createElement('div'); d.innerHTML = h;
  return (d.textContent || '').replace(/\n{2,}/g, '\n').trim();
}

/* ---------- bulk question parser ---------- */
function fmtNotation(html) {
  return html
    .replace(/\[([^\]\/\s][^\]\/]*)\/([^\]\/]+)\]/g, (m, a, b) => `<sup>${a}</sup>&frasl;<sub>${b}</sub>`)
    .replace(/\^(\{[^}]*\}|[+\-]?[0-9A-Za-z]+)/g, (m, x) => `<sup>${x.replace(/^\{|\}$/g, '')}</sup>`)
    .replace(/_(\{[^}]*\}|\d+)/g, (m, x) => `<sub>${x.replace(/^\{|\}$/g, '')}</sub>`);
}
function parseQuestions(text, opt = {}) {
  const conv = opt.notation !== false, defMarks = opt.marks || 1;
  const T = s => { let h = esc(String(s).trim()); if (conv) h = fmtNotation(h); return h; };
  let src = String(text || '').replace(/\r/g, '').replace(/\t/g, ' ').replace(/\u00a0/g, ' ');
  const NUMQ = /^\s*(?:q(?:uestion)?\s*)?(\d{1,4})\s*[\.\):\-]\s+(.*)$/i;
  if (!src.split('\n').some(l => NUMQ.test(l))) {
    src = src.split(/\n\s*\n/).map((b, i) => b.trim() ? `${i + 1}. ${b.trim()}` : '').filter(Boolean).join('\n');
  }
  const OPT = /^\s*(\*?)\s*\(?([A-Ha-h])[\.\)]\s+(.*)$/, ANS = /^\s*(?:ans(?:wer)?|correct(?:\s*answer)?|key)\s*[:=\-]\s*(.+)$/i,
    EXP = /^\s*(?:explanation|solution|reason|rationale|working)\s*[:\-]\s*(.*)$/i, MRK = /^\s*[\[\(]?\s*(?:marks?|score|points?)\s*[:=]\s*(\d+(?:\.\d+)?)\s*(?:marks?)?\s*[\]\)]?\s*$/i, MRK2 = /^\s*[\[\(]\s*(\d+(?:\.\d+)?)\s*(?:marks?|mks?|pts?|points?)\s*[\]\)]\s*$/i, INL = /[\[\(]\s*(\d+(?:\.\d+)?)\s*(?:marks?|mks?|pts?|points?)\s*[\]\)]/i, MEACH = /^\s*(?:marks?\s+each|default\s+marks?|each\s+question(?:\s+carries)?)\s*[:=\-]?\s*(\d+(?:\.\d+)?)\s*(?:marks?)?\s*$/i,
    SEC = /^\s*(?:\[section\s*:\s*(.+?)\]|#{1,3}\s+(.+))\s*$/i, PAS = /^\s*(?:\[passage\]|passage\s*:)\s*(.*)$/i, PASEND = /^\s*(?:\[\/passage\]|\[end passage\]|end passage)\s*$/i;
  const out = []; let cur = null, section = null, passage = null, inPassage = false, mode = 'body', ctxMarks = 0;
  const takeMarks = (s, c) => { const mm = s.match(INL); if (mm) { c.marks = +mm[1]; return s.replace(INL, '').replace(/\s{2,}/g, ' ').trim(); } return s; };
  const finish = () => {
    if (!cur) return;
    const o = cur.options.filter(x => x.raw.trim());
    let type, options = [], correct = [], multi = false;
    const ansTxt = (cur.answer || '').trim();
    if (o.length >= 2) {
      const isTF = o.length === 2 && o.every(x => /^(true|false)$/i.test(x.raw.trim()));
      if (isTF) {
        type = 'tf'; options = [{ id: 'T', text: 'True' }, { id: 'F', text: 'False' }];
        const ci = o.findIndex(x => x.ok); const pick = ci >= 0 ? o[ci].raw.trim().toLowerCase() : ansTxt.toLowerCase();
        if (pick) correct = [pick.startsWith('t') ? 'T' : 'F'];
      } else {
        type = 'mcq'; options = o.map(x => ({ id: sid(), text: T(x.raw), _l: x.letter }));
        options.forEach((op, i) => { if (o[i].ok) correct.push(op.id); });
        if (!correct.length && ansTxt) {
          const ls = ansTxt.toUpperCase().match(/\b[A-H]\b/g) || (/^[A-H]{1,4}$/.test(ansTxt.toUpperCase()) ? ansTxt.toUpperCase().split('') : []);
          ls.forEach(l => { const op = options.find(z => z._l === l); if (op && !correct.includes(op.id)) correct.push(op.id); });
        }
        multi = correct.length > 1; options.forEach(z => delete z._l);
      }
    } else if (/^(true|false)$/i.test(ansTxt)) {
      type = 'tf'; options = [{ id: 'T', text: 'True' }, { id: 'F', text: 'False' }]; correct = [ansTxt.toLowerCase() === 'true' ? 'T' : 'F'];
    } else if (ansTxt) { type = 'fib'; correct = ansTxt.split(/\s*[|;]\s*/).filter(Boolean); }
    else type = 'essay';
    out.push({
      section: cur.section, _p: cur.pid, type, body: T(cur.body).replace(/\n/g, '<br>'), options, correct, multi,
      explanation: T(cur.exp).replace(/\n/g, '<br>'), marks: cur.marks || cur.ctx || defMarks
    });
    cur = null; mode = 'body';
  };
  const flushPassage = () => { if (passage && passage.body.trim()) { out.push({ section: passage.section, _pid: passage.id, type: 'passage', body: T(passage.body).replace(/\n/g, '<br>'), options: [], correct: [], multi: false, explanation: '', marks: 0 }); } };
  let pcount = 0;
  src.split('\n').forEach(line => {
    let m;
    if (!line.trim()) { if (cur && mode === 'exp') cur.exp += '\n'; else if (passage && inPassage) passage.body += '\n'; return; }
    if ((m = line.match(SEC))) { finish(); if (inPassage) { flushPassage(); inPassage = false; } passage = null; const sp = (m[1] || m[2]).trim().split('|'); section = sp[0].trim(); if (sp[1]) { const mm = sp[1].match(/(\d+(?:\.\d+)?)/); if (mm) ctxMarks = +mm[1]; } return; }
    if ((m = line.match(MEACH))) { finish(); ctxMarks = +m[1]; return; }
    if (PASEND.test(line)) { finish(); if (inPassage) { flushPassage(); inPassage = false; } passage = null; return; }
    if ((m = line.match(PAS))) { finish(); if (inPassage) flushPassage(); passage = { id: 'p' + (++pcount), body: m[1] || '', section }; inPassage = true; return; }
    if ((m = line.match(NUMQ))) {
      finish();
      if (inPassage) { flushPassage(); inPassage = false; }
      cur = { section, pid: passage ? passage.id : null, body: '', options: [], exp: '', answer: '', marks: 0, ctx: ctxMarks }; cur.body = takeMarks(m[2], cur); mode = 'body'; return;
    }
    if (inPassage) { passage.body += (passage.body ? '\n' : '') + line.trim(); return; }
    if (!cur) return;
    if ((m = line.match(MRK)) || (m = line.match(MRK2))) { cur.marks = +m[1]; return; }
    if ((m = line.match(EXP))) { cur.exp = m[1]; mode = 'exp'; return; }
    if ((m = line.match(ANS))) { cur.answer = m[1]; mode = 'ans'; return; }
    if (mode !== 'exp' && (m = line.match(OPT))) {
      let raw = m[3].trim(), ok = !!m[1];
      if (/^\*/.test(raw)) { ok = true; raw = raw.replace(/^\*\s*/, ''); }
      if (/(\*|✓|✔|\(correct\))\s*$/i.test(raw)) { ok = true; raw = raw.replace(/\s*(\*|✓|✔|\(correct\))\s*$/i, ''); }
      cur.options.push({ letter: m[2].toUpperCase(), raw, ok }); mode = 'opt'; return;
    }
    if (mode === 'exp') cur.exp += (cur.exp ? '\n' : '') + line.trim();
    else if (mode === 'opt' && cur.options.length) cur.options[cur.options.length - 1].raw += ' ' + line.trim();
    else if (mode === 'ans') cur.answer += ' ' + line.trim();
    else cur.body += '\n' + takeMarks(line.trim(), cur);
  });
  finish(); if (inPassage) flushPassage();
  return out;
}

/* ---------- calculator engine (no eval) ---------- */
function calcEval(expr, deg = true, ans = 0) {
  const s = String(expr).replace(/×/g, '*').replace(/÷/g, '/').replace(/π/g, 'pi').replace(/√/g, 'sqrt').replace(/\s+/g, '').replace(/−/g, '-');
  let i = 0;
  const err = () => { throw new Error('Error'); };
  const fact = n => { if (n < 0 || n !== Math.floor(n) || n > 170) err(); let r = 1; for (let k = 2; k <= n; k++) r *= k; return r; };
  const toRad = x => deg ? x * Math.PI / 180 : x, fromRad = x => deg ? x * 180 / Math.PI : x;
  const FN = {
    sin: x => toRad(x) % Math.PI === 0 ? 0 : Math.sin(toRad(x)), cos: x => Math.abs(Math.cos(toRad(x))) < 1e-15 ? 0 : Math.cos(toRad(x)), tan: x => Math.tan(toRad(x)),
    asin: x => fromRad(Math.asin(x)), acos: x => fromRad(Math.acos(x)), atan: x => fromRad(Math.atan(x)),
    log: Math.log10, ln: Math.log, sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs, exp: Math.exp
  };
  function expr_() {
    let v = term();
    while (s[i] === '+' || s[i] === '-') { const o = s[i++]; const r = term(); v = o === '+' ? v + r : v - r; }
    return v;
  }
  function term() {
    let v = power();
    for (; ;) {
      if (s[i] === '*' || s[i] === '/') { const o = s[i++]; const r = power(); v = o === '*' ? v * r : v / r; }
      else if (i < s.length && (s[i] === '(' || /[a-z0-9.]/i.test(s[i]))) { v = v * power(); }
      else break;
    }
    return v;
  }
  function power() { const b = unary(); return b; }
  function unary() { if (s[i] === '-') { i++; return -unary(); } if (s[i] === '+') { i++; return unary(); } return pow(); }
  function pow() { const b = post(); if (s[i] === '^') { i++; const e = unary(); return Math.pow(b, e); } return b; }
  function post() { let v = prim(); while (s[i] === '!' || s[i] === '%') { if (s[i++] === '!') v = fact(v); else v = v / 100; } return v; }
  function prim() {
    if (s[i] === '(') { i++; const v = expr_(); if (s[i] !== ')') err(); i++; return v; }
    const m = s.slice(i).match(/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i);
    if (m) { i += m[0].length; return parseFloat(m[0]); }
    const w = s.slice(i).match(/^[a-z]+/i);
    if (w) {
      const name = w[0].toLowerCase();
      if (name === 'pi') { i += 2; return Math.PI; }
      if (name === 'ans') { i += 3; return ans; }
      if (name === 'e') { i += 1; return Math.E; }
      for (const k of Object.keys(FN)) if (name.startsWith(k)) {
        i += k.length; if (s[i] === '(') { i++; const v = expr_(); if (s[i] !== ')') err(); i++; return FN[k](v); }
        return FN[k](power());
      }
    }
    err();
  }
  const v = expr_(); if (i < s.length) err();
  if (!isFinite(v)) err();
  return parseFloat(v.toPrecision(12));
}

const V = { tok: 0, cleanups: [] };
const onLeave = fn => V.cleanups.push(fn);
const stale = t => t !== V.tok;
const loggedIn = () => !!(S.me && !S.me.anon);
const isAdmin = () => !!(S.me && S.me.role === 'admin');
const ACT = {}, CHG = {}, INP = {};

const cleanErr = e => { const m = (e && e.message) || String(e || 'Something went wrong'); return m.replace(/^.*?ERROR:\s*/, '').replace(/^Error:\s*/, ''); };
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw new Error(cleanErr(error)); return data; }
async function db(p) { const { data, error } = await p; if (error) throw new Error(cleanErr(error)); return data; }
function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin" style="width:18px;height:18px;margin:0;border-width:2px"></span>'; }
  else { btn.disabled = false; if (btn.dataset.l) btn.innerHTML = label || btn.dataset.l; }
}

function syncMeta() { const m = $('meta[name=theme-color]'); if (m) m.content = (getComputedStyle(document.documentElement).getPropertyValue('--bg') || '#0A0B18').trim(); }
function applyTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('qb_theme', t); } catch (e) { } syncMeta(); }
const ACCENTS = { royal: ['Royal', '#8F7CFF', '#5C6CFF'], emerald: ['Emerald', '#E2C170', '#0F9F72'], sunset: ['Sunset', '#FF8F5E', '#F0506E'], ocean: ['Ocean', '#39E0F0', '#3D8BFF'] };
function applyAccent(a) { if (!ACCENTS[a]) a = 'royal'; document.documentElement.dataset.accent = a; try { localStorage.setItem('qb_accent', a); } catch (e) { } syncMeta(); }
async function loadMe() {
  const { data } = await sb.auth.getSession(); S.session = data.session;
  if (!S.session) { S.me = null; return; }
  const u = S.session.user;
  if (u.is_anonymous || !u.email) { S.me = { id: u.id, anon: true, username: 'Guest', role: 'guest' }; return; }
  const { data: p } = await sb.from('profiles').select('*').eq('id', u.id).maybeSingle();
  S.me = p ? { id: u.id, email: u.email, username: p.username, role: p.role, banned: p.banned, anon: false, hasQA: !!p.security_question }
    : { id: u.id, email: u.email, username: (u.email || '').split('@')[0], role: 'user', anon: false, hasQA: false };
}
function needLogin(msg) {
  if (loggedIn()) return true;
  S.returnTo = location.hash.replace(/^#/, '') || '/';
  toast(msg || 'Please sign in first');
  nav('/auth/login'); return false;
}
const nav = p => { if (location.hash === '#' + p) render(); else location.hash = '#' + p; };
const setView = html => { const v = $('#view'); if (v) { v.innerHTML = html; window.scrollTo(0, 0); } };
const skel = (n = 3) => Array.from({ length: n }, () => '<div class="skel"></div>').join('');
const parseHash = () => { const h = location.hash.replace(/^#/, '') || '/'; const [path, qs] = h.split('?'); return { path: path || '/', query: Object.fromEntries(new URLSearchParams(qs || '')) }; };

function renderChrome() {
  const me = S.me, li = loggedIn();
  if (!$('#view')) $('#app').innerHTML = '<header class="top"></header><main id="view"></main><nav class="nav" id="nav"></nav>';
  $('header.top').innerHTML = `<div class="in">
    <a class="brand" href="#/">${LOGO}<span>QuizBuilt</span></a><div class="grow"></div>
    <button class="iconbtn" data-act="theme" aria-label="Switch light or dark">${ic(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon', 18)}</button>
    ${isAdmin() ? `<a class="iconbtn" href="#/admin" aria-label="Admin panel" style="color:var(--brass)">${ic('shield', 18)}</a>` : ''}
    ${li ? `<a class="me-chip" href="#/me"><span class="avatar">${esc(initial(me.username))}</span><span class="trunc">${esc(me.username)}</span></a>`
      : me && me.anon ? `<a class="me-chip" href="#/auth/login"><span class="avatar">G</span><span>Sign in</span></a>`
        : `<a class="btn sm brass" href="#/auth/login">Sign in</a>`}
  </div>`;
  $('#nav').innerHTML = `
    <a href="#/" data-n="home">${ic('home', 22)}<span>Home</span></a>
    <a href="#/explore" data-n="explore">${ic('compass', 22)}<span>Explore</span></a>
    <a href="#/create" class="mk" data-n="create" aria-label="Create a quiz">${ic('plus', 28)}</a>
    <a href="#/me/quizzes" data-n="mine">${ic('layers', 22)}<span>My quizzes</span></a>
    <a href="#/me" data-n="me">${ic('user', 22)}<span>Account</span></a>`;
  navHighlight();
}
function navHighlight() {
  const p = parseHash().path; let k = '';
  if (p === '/') k = 'home'; else if (p.startsWith('/explore')) k = 'explore'; else if (p.startsWith('/create')) k = 'create';
  else if (p.startsWith('/me/quizzes')) k = 'mine'; else if (p.startsWith('/me') || p.startsWith('/auth') || p.startsWith('/admin')) k = 'me';
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.n === k));
}

/* ---------- event delegation ---------- */
const errHandler = e => { console.error(e); toast(cleanErr(e), 'bad'); };
document.addEventListener('click', e => {
  const ov = e.target.closest && e.target.closest('[data-ovl]');
  if (ov && e.target === ov && !$('#modal')._lock) { closeSheet(); return; }
  const rt = e.target.closest && e.target.closest('.tb button,.syms button');
  if (rt) { e.preventDefault(); rteCmd(rt); return; }
  const el = e.target.closest && e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  Promise.resolve().then(() => fn(el, e)).catch(errHandler);
});
document.addEventListener('mousedown', e => { if (e.target.closest && e.target.closest('.tb button,.syms button')) e.preventDefault(); });
document.addEventListener('change', e => { const el = e.target.closest && e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) Promise.resolve().then(() => CHG[el.dataset.chg](el, e)).catch(errHandler); });
document.addEventListener('input', e => { const el = e.target.closest && e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e); });
document.addEventListener('paste', e => {
  const ed = e.target.closest && e.target.closest('.rt'); if (!ed) return;
  e.preventDefault(); const t = (e.clipboardData || window.clipboardData).getData('text/plain'); document.execCommand('insertText', false, t);
});

ACT.theme = () => { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); renderChrome(); };
ACT.eye = el => { const i = $('input', el.parentElement); const on = i.type === 'password'; i.type = on ? 'text' : 'password'; el.innerHTML = ic(on ? 'eyeoff' : 'eye', 18); };
ACT.back = () => { if (history.length > 1) history.back(); else nav('/'); };
ACT.goto = el => nav(el.dataset.to);
ACT.copy = el => copyText(el.dataset.v);
ACT.close = () => closeSheet();

/* ---------- router ---------- */
const ROUTES = [
  [/^\/$/, vHome], [/^\/explore$/, vExplore],
  [/^\/auth(?:\/(login|signup|forgot))?$/, vAuth],
  [/^\/me(?:\/(quizzes|attempts|settings))?$/, vMe],
  [/^\/create$/, vEditor], [/^\/edit\/([\w-]+)(?:\/(details|questions|publish))?$/, vEditor],
  [/^\/(?:quiz|q)\/([\w-]+)$/, vQuiz],
  [/^\/leaderboard\/([\w-]+)$/, vLeaderboardFull], [/^\/attempts\/([\w-]+)$/, vAttemptsFull],
  [/^\/take\/([\w-]+)$/, vTake], [/^\/preview\/([\w-]+)$/, vPreview],
  [/^\/result\/([\w-]+)$/, vResult], [/^\/review\/([\w-]+)$/, vReview],
  [/^\/results\/([\w-]+)$/, vOwnerResults],
  [/^\/admin(?:\/(users|quizzes|attempts))?$/, vAdmin]
];
async function render() {
  const { path, query } = parseHash();
  const cl = V.cleanups; V.cleanups = []; cl.forEach(f => { try { f(); } catch (e) { } });
  const tok = ++V.tok;
  document.body.classList.remove('taking', 'noselect');
  if (!$('#view')) renderChrome();
  closeSheet();
  for (const [re, fn] of ROUTES) {
    const m = path.match(re);
    if (m) { try { await fn(m.slice(1), query, tok); } catch (e) { console.error(e); if (!stale(tok)) errView(cleanErr(e)); } navHighlight(); return; }
  }
  setView(`<div class="wrap"><div class="empty">${ic('compass', 34)}<h3 class="h2">Page not found</h3><p class="gap0"><a class="link" href="#/">Go home</a></p></div></div>`);
  navHighlight();
}
function errView(msg) {
  setView(`<div class="wrap"><div class="empty">${ic('alert', 34)}<h3 class="h2">Something went wrong</h3><p class="gap0">${esc(msg)}</p><div class="row gap" style="justify-content:center"><button class="btn" data-act="reload">Try again</button><a class="btn ghost" href="#/">Home</a></div></div></div>`);
}
ACT.reload = () => render();

    q.status === 'draft' ? '<span class="badge warn">Draft</span>' : '',
    q.is_challenge ? `<span class="badge gold">${ic('zap', 12)} Challenge</span>` : '',
    q.visibility === 'private' ? `<span class="badge">${ic('lock', 12)} Private</span>` : '',
    q.featured ? `<span class="badge gold">${ic('star', 12)} Featured</span>` : '',
    `<span class="badge">${esc(catName(q.category))}</span>`
  ].join(' ');
  return `<div class="slip"><a href="#/quiz/${esc(q.share_code)}" style="display:block"><div class="row wrapf" style="gap:6px">${b}</div>
    <h3>${esc(q.title)}</h3><div class="mut sm">by @${esc(q.owner_name || 'user')}</div>
    <div class="meta"><span>${ic('help', 14)} ${q.question_count || 0} questions</span><span>${ic('clock', 14)} ${q.duration_min} min</span><span>${ic('users', 14)} ${q.attempts_count || 0}</span><span>${ic('heart', 14)} ${q.likes_count || 0}</span></div></a>${extra}</div>`;
}
const keyChip = code => `<button class="keychip" data-act="copy" data-v="${esc(code)}" aria-label="Copy quiz key">${ic('key', 13)}<span>${esc(String(code || '').toUpperCase())}</span>${ic('copy', 12)}</button>`;
const emptyBox = (icon, title, sub = '') => `<div class="empty">${ic(icon, 32)}<div class="b" style="color:var(--tx)">${esc(title)}</div>${sub ? `<div class="sm gap0">${sub}</div>` : ''}</div>`;
const secT = (t, right = '') => `<div class="sec-t"><h2 class="h2">${esc(t)}</h2>${right}</div>`;

/* ============================================================
   AUTH
   ============================================================ */
const AUTH = { email: '' };
function pwField(id, label, ph = '') {
  return `<label class="lbl" for="${id}">${label}</label><div class="pw"><input class="inp" id="${id}" type="password" placeholder="${ph}" autocomplete="${id === 'l-pw' ? 'current-password' : 'new-password'}"><button type="button" class="eye" data-act="eye" aria-label="Show password">${ic('eye', 18)}</button></div>`;
}
async function vAuth([mode], q, tok) {
  mode = mode || 'login';
  if (loggedIn() && mode !== 'forgot') { nav('/'); return; }
  const head = (t, s) => `<div class="auth-hero"><div class="brand">${LOGO}<span>QuizBuilt</span></div><h1 class="h1">${t}</h1><p>${s}</p></div>`;
  if (mode === 'login') {
    setView(`<div class="wrap narrow">${head('Welcome back', 'Sign in with your email and password.')}
      <div class="card gap">
        <label class="lbl" for="l-em">Email</label><input class="inp" id="l-em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
        ${pwField('l-pw', 'Password', 'Your password')}
        <div class="err" id="auth-err"></div>
        <button class="btn brass block gap" id="l-go" data-act="login">Sign in</button>
        <div class="row between gap"><a class="link sm" href="#/auth/forgot">Forgot password?</a><a class="link sm" href="#/auth/signup">Create account</a></div>
      </div></div>`);
    $('#l-pw').addEventListener('keydown', e => { if (e.key === 'Enter') ACT.login($('#l-go')); });
  } else if (mode === 'signup') {
    setView(`<div class="wrap narrow">${head('Create your account', 'Pick a username. It is the name others will see.')}
      <div class="card gap">
        <label class="lbl" for="s-un">Username</label><input class="inp" id="s-un" maxlength="20" autocapitalize="none" autocomplete="username" placeholder="e.g. Ogonor20008" data-inp="unamechk">
        <div class="hint" id="un-hint">3–20 letters, numbers, dot or underscore.</div>
        <label class="lbl" for="s-em">Email</label><input class="inp" id="s-em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com">
        ${pwField('s-pw', 'Password', 'At least 8 characters')}
        <div class="meter"><i id="pw-m"></i></div>
        ${pwField('s-pw2', 'Confirm password', 'Type it again')}
        <label class="lbl" for="s-sq">Security question</label>
        <select class="inp" id="s-sq" data-chg="sqsel">${SEC_QUESTIONS.map(x => `<option>${esc(x)}</option>`).join('')}<option value="__own">Write my own question…</option></select>
        <input class="inp" id="s-sq2" placeholder="Your own question" style="display:none;margin-top:8px">
        <label class="lbl" for="s-sa">Answer</label><input class="inp" id="s-sa" autocomplete="off" placeholder="Your answer">
        <div class="hint">If you ever forget your password, this is how you get back in. Remember the exact answer.</div>
        <div class="err" id="auth-err"></div>
        <button class="btn brass block gap" id="s-go" data-act="signup">Create account</button>
        <div class="center sm gap">Already have an account? <a class="link" href="#/auth/login">Sign in</a></div>
      </div></div>`);
    $('#s-pw').setAttribute('data-inp', 'pwmeter');
  } else {
    AUTH.step = 1;
    setView(`<div class="wrap narrow">${head('Reset password', 'Answer your security question to set a new password.')}
      <div class="card gap" id="fg-box">
        <label class="lbl" for="f-em">Your email</label><input class="inp" id="f-em" type="email" inputmode="email" placeholder="you@example.com">
        <div class="err" id="auth-err"></div>
        <button class="btn brass block gap" data-act="forgot1">Continue</button>
        <div class="center sm gap"><a class="link" href="#/auth/login">Back to sign in</a></div>
      </div></div>`);
  }
}
INP.unamechk = debounce(async el => {
  const v = el.value.trim(), h = $('#un-hint'); if (!h) return;
  if (!v) { h.className = 'hint'; h.textContent = '3–20 letters, numbers, dot or underscore.'; return; }
  if (!/^[A-Za-z0-9_.]{3,20}$/.test(v)) { h.className = 'hint bad'; h.textContent = 'Use 3–20 letters, numbers, dot or underscore.'; return; }
  try { const ok = await rpc('username_available', { p_username: v }); if (el.value.trim() !== v) return; h.className = 'hint ' + (ok ? 'ok' : 'bad'); h.textContent = ok ? 'Username is available' : 'That username is taken'; } catch (e) { }
}, 400);
INP.pwmeter = el => {
  const v = el.value; let s = 0; if (v.length >= 8) s++; if (v.length >= 11) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v)) s++;
  const m = $('#pw-m'); m.style.width = (s * 20) + '%'; m.style.background = s < 3 ? 'var(--bad)' : s < 4 ? 'var(--warn)' : 'var(--ok)';
};
CHG.sqsel = el => { $('#s-sq2').style.display = el.value === '__own' ? '' : 'none'; };
const authErr = m => { const e = $('#auth-err'); if (e) e.textContent = m || ''; };
function mapAuthError(m) {
  m = cleanErr(m);
  if (/already registered|already been registered/i.test(m)) return 'That email already has an account. Try signing in.';
  if (/database error/i.test(m)) return 'That username is taken or not allowed. Try another one.';
  if (/invalid login/i.test(m)) return 'Wrong email or password.';
  if (/rate limit|too many/i.test(m)) return 'Too many tries. Please wait a few minutes.';
  if (/email not confirmed/i.test(m)) return 'Please confirm your email first (check your inbox).';
  if (/failed to fetch|network/i.test(m)) return 'No internet connection. Please try again.';
  return m;
}
ACT.login = async btn => {
  const email = $('#l-em').value.trim(), pw = $('#l-pw').value; authErr('');
  if (!email || !pw) return authErr('Enter your email and password.');
  busy(btn, true);
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await loadMe(); renderChrome();
    const to = S.returnTo || '/'; S.returnTo = null; nav(to);
  } catch (e) { authErr(mapAuthError(e)); busy(btn, false); }
};
ACT.signup = async btn => {
  authErr('');
  const un = $('#s-un').value.trim(), em = $('#s-em').value.trim(), pw = $('#s-pw').value, pw2 = $('#s-pw2').value, sa = $('#s-sa').value.trim();
  let sq = $('#s-sq').value; if (sq === '__own') sq = $('#s-sq2').value.trim();
  if (!/^[A-Za-z0-9_.]{3,20}$/.test(un)) return authErr('Username must be 3–20 letters, numbers, dot or underscore.');
  if (!/^\S+@\S+\.\S+$/.test(em)) return authErr('Enter a valid email address.');
  if (pw.length < 8) return authErr('Password must be at least 8 characters.');
  if (pw !== pw2) return authErr('The two passwords do not match.');
  if (sq.length < 5) return authErr('Write a security question.');
  if (sa.length < 2) return authErr('Enter an answer to your security question.');
  busy(btn, true);
  try {
    if (S.me && S.me.anon) { await sb.auth.signOut(); }
    if (!(await rpc('username_available', { p_username: un }))) throw new Error('That username is taken. Try another one.');
    const { data, error } = await sb.auth.signUp({ email: em, password: pw, options: { data: { username: un } } });
    if (error) throw error;
    let session = data.session;
    if (!session) { const r = await sb.auth.signInWithPassword({ email: em, password: pw }); if (!r.error) session = r.data.session; }
    if (!session) {
      setView(`<div class="wrap narrow"><div class="card gap center">${ic('check', 34)}<h2 class="h2 gap0">Account created</h2><p class="mut gap0">We sent a confirmation link to <b>${esc(em)}</b>. Confirm it, then sign in.</p><a class="btn brass block gap" href="#/auth/login">Go to sign in</a></div></div>`);
      return;
    }
    try { await rpc('set_security_qa', { p_question: sq, p_answer: sa }); } catch (e) { toast('Account created, but the security question was not saved. Add it in Account → Settings.', 'bad'); }
    await loadMe(); renderChrome(); toast('Welcome, ' + S.me.username + '!', 'ok');
    const to = S.returnTo || '/'; S.returnTo = null; nav(to);
  } catch (e) { authErr(mapAuthError(e)); busy(btn, false); }
};
ACT.forgot1 = async btn => {
  const em = $('#f-em').value.trim(); authErr('');
  if (!/^\S+@\S+\.\S+$/.test(em)) return authErr('Enter your email address.');
  busy(btn, true);
  try {
    const q = await rpc('get_security_question', { p_email: em });
    if (!q) throw new Error('No security question is set for that email. Password reset is not available for it.');
    AUTH.email = em;
    $('#fg-box').innerHTML = `<div class="badge gold">Your security question</div><p class="b gap0" style="font-size:17px">${esc(q)}</p>
      <label class="lbl" for="f-an">Your answer</label><input class="inp" id="f-an" autocomplete="off">
      ${pwField('f-pw', 'New password', 'At least 8 characters')}${pwField('f-pw2', 'Confirm new password')}
      <div class="err" id="auth-err"></div><button class="btn brass block gap" data-act="forgot2">Reset password</button>`;
  } catch (e) { authErr(cleanErr(e)); busy(btn, false); }
};
ACT.forgot2 = async btn => {
  const an = $('#f-an').value, pw = $('#f-pw').value, pw2 = $('#f-pw2').value; authErr('');
  if (!an.trim()) return authErr('Enter your answer.');
  if (pw.length < 8) return authErr('Password must be at least 8 characters.');
  if (pw !== pw2) return authErr('The two passwords do not match.');
  busy(btn, true);
  try {
    const r = await rpc('reset_password_with_answer', { p_email: AUTH.email, p_answer: an, p_new_password: pw });
    if (r !== 'ok') throw new Error(r);
    toast('Password changed. Sign in with the new one.', 'ok');
    if (loggedIn()) { await sb.auth.signOut(); await loadMe(); renderChrome(); }
    nav('/auth/login');
  } catch (e) { authErr(cleanErr(e)); busy(btn, false); }
};
ACT.logout = async () => {
  if (!await ask({ title: 'Sign out?', ok: 'Sign out' })) return;
  await sb.auth.signOut(); await loadMe(); renderChrome(); nav('/');
};

async function vHome(a, q, tok) {
  const li = loggedIn(), me = S.me;
  const hero = li ? `<div class="hero"><div class="mut sm">Hello,</div><h1 class="h1" style="margin-top:2px">@${esc(me.username)}</h1>
      <p class="mut gap0">What are we quizzing today?</p>

      <p class="mut gap0">Mock exams for JAMB, Post-UTME, WAEC, school tests and fun challenges, with timers, anti-cheat, leaderboards and instant results.</p>
      <div class="row gap wrapf"><a class="btn brass" href="#/auth/signup">Create free account</a><a class="btn" href="#/auth/login">Sign in</a></div></div>`;
  const join = `<div class="card tight gap"><div class="row"><input class="inp" id="join-code" placeholder="Have a quiz code or link?" autocapitalize="none" style="flex:1"><button class="btn" data-act="join">Open</button></div></div>`;
  const warn = li && me.banned ? `<div class="card gap" style="border-color:var(--bad)"><b class="bad">Your account is suspended.</b><div class="sm mut">You can browse, but you cannot take or create quizzes. Contact the admin.</div></div>` : '';
  const qa = li && !me.hasQA && !me.banned ? `<div class="card gap" style="border-color:var(--warn)"><b class="warnc">Set a security question</b><div class="sm mut">Without one you cannot reset a forgotten password.</div><a class="btn sm gap0" href="#/me/settings">Set it now</a></div>` : '';
  setView(`<div class="wrap">${hero}${warn}${qa}${join}<div id="home-cont"></div><div id="home-lists">${skel(3)}</div></div>`);
  $('#join-code').addEventListener('keydown', e => { if (e.key === 'Enter') ACT.join(); });

  const jobs = [
    db(sb.from('quizzes').select(QCOLS).eq('status', 'published').eq('visibility', 'public').eq('featured', true).order('published_at', { ascending: false }).limit(4)),

async function edLoad(id) {
  const quiz = await db(sb.from('quizzes').select('*').eq('id', id).maybeSingle());
  if (!quiz) throw new Error('Quiz not found');
  if (quiz.owner_id !== S.me.id && !isAdmin()) throw new Error('You can only edit your own quizzes');
  const [sets, qs, keys] = await Promise.all([
    db(sb.from('question_sets').select('*').eq('quiz_id', id).order('position')),
    db(sb.from('questions').select('*').eq('quiz_id', id).order('position')),
    db(sb.from('question_keys').select('*').eq('quiz_id', id))
  ]);
  const km = {}; keys.forEach(k => km[k.question_id] = k);
  E.quiz = quiz; E.vis = quiz.visibility; E.deleted = []; E.delSets = []; E.dirty = false;
  E.sets = sets.map(s => ({ id: s.id, name: s.name, position: s.position }));
  E.qs = qs.map(q => ({
    id: q.id, set_id: q.set_id, parent_id: q.parent_id, type: q.type, body: q.body || '', options: q.options || [], multi: !!q.multi,
    marks: +q.marks, correct: km[q.id] ? (km[q.id].correct || []) : [], explanation: km[q.id] ? (km[q.id].explanation || '') : '', _open: false
  }));
  if (!E.sets.length) { E.sets = [{ id: uid(), name: 'Section 1', position: 0 }]; E.dirty = true; }
  E.active = E.sets[0].id;
}

function edReadDetails() {
  const v = id => $('#' + id).value, c = id => $('#' + id).checked;
  const title = v('d-title').trim(); if (!title) throw new Error('Give your quiz a title');
  const dur = parseInt(v('d-dur'), 10); if (!(dur >= 1 && dur <= 600)) throw new Error('Duration must be between 1 and 600 minutes');
  const pass = parseInt(v('d-pass'), 10); if (!(pass >= 0 && pass <= 100)) throw new Error('Pass mark must be between 0 and 100');
  const ac = c('d-ac');
  const quotes = $$('.qrow').map(r => ({ min: clamp(parseInt($('.q-min', r).value, 10) || 0, 0, 100), text: $('.q-txt', r).value.trim() })).filter(x => x.text).sort((a, b) => b.min - a.min);
  const intake = $$('.irow').map(r => ({
    id: r.dataset.id, label: $('.i-lbl', r).value.trim(), type: $('.i-type', r).value, required: $('.i-req', r).checked,
    options: $('.i-opts', r).value.split(',').map(x => x.trim()).filter(Boolean)
  })).filter(x => x.label).map(x => (x.type === 'choice' && x.options.length < 2) ? Object.assign(x, { type: 'text' }) : x);
  const sched = c('d-sched'), st = fromLocalInput(v('d-start')), en = fromLocalInput(v('d-end'));
  if (sched && st && en && new Date(en) <= new Date(st)) throw new Error('The closing time must be after the opening time');
  const rel = c('d-showres') ? v('d-rel') : 'immediate';
  if (rel === 'scheduled' && !v('d-relat')) throw new Error('Choose when results are released');
  return {
    title, description: v('d-desc').trim(), instructions: v('d-inst').trim(), category: v('d-cat'), is_challenge: c('d-chal'),
    duration_min: dur, pass_mark: pass, shuffle_questions: c('d-shq'), shuffle_options: c('d-sho'),
    allow_multiple_attempts: c('d-multi'), max_attempts: c('d-multi') ? (parseInt(v('d-maxatt'), 10) || null) : null,
    allow_resume: ac ? false : c('d-resume'), anticheat: ac, anticheat_voice: ac && c('d-voice'),
    anticheat_voice_mode: ($('input[name=d-vmode]:checked') || {}).value || 'aggressive',
    require_login: c('d-login'), allow_guest: c('d-guest'), show_answers: c('d-showans'), show_results: c('d-showres'),
    release_mode: rel, release_at: rel === 'scheduled' ? fromLocalInput(v('d-relat')) : null,
    calculator: c('d-calc') ? v('d-calctype') : 'none', score_quotes: quotes, allow_likes: c('d-likes'), allow_comments: c('d-comm'),
    allow_sharing: c('d-shr'), leaderboard_enabled: c('d-lb'), schedule_enabled: sched, starts_at: sched ? st : null, ends_at: sched ? en : null,
    fifty_fifty: c('d-fifty'), fifty_count: clamp(parseInt(v('d-fc'), 10) || 2, 1, 50), auto_advance: c('d-auto'), intake_form: intake, visibility: E.vis,
    is_paid: c('d-paid'), price_amount: c('d-paid') ? (parseFloat(v('d-price')) || 0) : null, price_currency: v('d-curr'),
    paystack_public_key: v('d-pstk').trim(),
    prize_enabled: c('d-prize'), prize_mode: (($('#pz-seg .on') || {}).dataset || {}).v || 'top3', prize_text: { desc: $('#d-ptext') ? $('#d-ptext').value.trim() : '' }
  };
}
async function edSaveDetails(silent) {
  let vals; try { vals = edReadDetails(); } catch (e) { toast(e.message, 'bad'); return false; }
  const btn = $('#d-save'); busy(btn, true);
  try {
    if (E.quiz) {
      const row = await db(sb.from('quizzes').update(vals).eq('id', E.quiz.id).select().single());
      E.quiz = row; if (!silent) toast('Saved', 'ok');
    } else {
      const row = await db(sb.from('quizzes').insert(Object.assign({ show_percentage: true }, vals, { owner_id: S.me.id })).select().single());
      const setId = uid();
      await db(sb.from('question_sets').insert({ id: setId, quiz_id: row.id, name: 'Section 1', position: 0 }));
      E.quiz = row; E.sets = [{ id: setId, name: 'Section 1', position: 0 }]; E.qs = []; E.active = setId; E.deleted = []; E.delSets = []; E.dirty = false;
      toast('Quiz created', 'ok');
    }
    busy(btn, false); return true;
  } catch (e) { busy(btn, false); toast(cleanErr(e), 'bad'); return false; }
}
ACT['ed-save-continue'] = async () => { if (await edSaveDetails(false)) nav(`/edit/${E.quiz.id}/questions`); };

function qGroup(q) {

function qCard(q) {

    <button class="iconbtn qdel" data-act="q-del" data-id="${q.id}" aria-label="Delete this question">${ic('trash', 17)}</button></div>`;

    inner += `<label class="lbl">${isP ? 'Passage' : 'Question'}</label>${rte({ html: q.body, ph: isP ? 'Type or paste the passage…' : 'Type question', attrs: `data-q="${q.id}" data-f="body"` })}`;
    if (q.type === 'mcq') {
      inner += q.options.map((o, i) => `<div class="opt-e"><div class="ol">${LETTERS[i] || i + 1}</div><div class="grow">${rte({ html: o.text, ph: 'Option ' + (LETTERS[i] || i + 1), compact: true, attrs: `data-q="${q.id}" data-o="${o.id}"` })}</div>
        <label class="ck"><input type="${q.multi ? 'checkbox' : 'radio'}" name="ok-${q.id}" data-chg="opt-ok" data-q="${q.id}" data-o="${o.id}" ${q.correct.includes(o.id) ? 'checked' : ''}>Answer</label>

      inner += `<button class="btn sm gap0" data-act="opt-add" data-q="${q.id}">${ic('plus', 14)} Add option</button>`;

/* ---------- saving questions ---------- */
async function edSave(manual) {
  if (!E.quiz) return;
  if (E.saving) { E.again = true; return; }
  clearTimeout(E.timer); E.saving = true; const rev0 = E.rev; edPill('Saving…', '');
  try {
    const qid = E.quiz.id;
    E.sets.forEach((s, i) => s.position = i);
    await db(sb.from('question_sets').upsert(E.sets.map(s => ({ id: s.id, quiz_id: qid, name: (s.name || '').trim() || 'Section', position: s.position }))));
    if (E.delSets.length) { await db(sb.from('question_sets').delete().in('id', E.delSets)); E.delSets = []; }
    if (E.deleted.length) { await db(sb.from('questions').delete().in('id', E.deleted)); E.deleted = []; }
    const hasImg = h => /<img/i.test(h || '');
    const rows = E.qs.map((q, i) => {
      let options = [], correct = q.correct;
      if (q.type === 'mcq') {
        options = q.options.map(o => ({ id: o.id, text: clean(o.text) })).filter(o => textOf(o.text) || hasImg(o.text));
        correct = q.correct.filter(c => options.some(o => o.id === c));
      } else if (q.type === 'tf') { options = [{ id: 'T', text: 'True' }, { id: 'F', text: 'False' }]; }
      else if (q.type === 'fib') correct = q.correct.map(a => String(a).trim()).filter(Boolean);
      else correct = [];
      return {
        row: { id: q.id, quiz_id: qid, set_id: q.set_id, parent_id: q.parent_id || null, position: i * 10, type: q.type, body: clean(q.body), options, multi: q.type === 'mcq' && !!q.multi, marks: q.type === 'passage' ? 0 : Math.max(0, +q.marks || 0) },
        key: q.type === 'passage' ? null : { question_id: q.id, quiz_id: qid, correct, explanation: clean(q.explanation) }
      };
    });
    const parents = rows.filter(r => !r.row.parent_id).map(r => r.row), kids = rows.filter(r => r.row.parent_id).map(r => r.row);
    for (let i = 0; i < parents.length; i += 100) await db(sb.from('questions').upsert(parents.slice(i, i + 100)));
    for (let i = 0; i < kids.length; i += 100) await db(sb.from('questions').upsert(kids.slice(i, i + 100)));
    const keys = rows.map(r => r.key).filter(Boolean);
    for (let i = 0; i < keys.length; i += 100) await db(sb.from('question_keys').upsert(keys.slice(i, i + 100)));
    const ans = E.qs.filter(q => q.type !== 'passage');
    const upd = await db(sb.from('quizzes').update({ question_count: ans.length, total_marks: ans.reduce((a, q) => a + (+q.marks || 0), 0) }).eq('id', qid).select().single());
    E.quiz = Object.assign(E.quiz, { question_count: upd.question_count, total_marks: upd.total_marks });
    if (E.rev === rev0) { E.dirty = false; window.onbeforeunload = null; edPill('All changes saved', 'ok'); }
    else { E.dirty = true; edPill('Unsaved changes', 'warn'); clearTimeout(E.timer); E.timer = setTimeout(edSave, 800); }
    if (manual) toast('Saved', 'ok');
  } catch (e) { edPill('Not saved – tap Save', 'bad'); if (manual || true) toast('Could not save: ' + cleanErr(e), 'bad'); }
  E.saving = false;
  if (E.again) { E.again = false; if (E.dirty) edSave(); }
}

  const q = Q.quiz, now = Date.now();

async function ensurePaid(q) {
  if (!q.is_paid) return true;
  if (S.me && (S.me.id === q.owner_id || isAdmin())) return true;
  const already = await rpc('has_paid', { p_quiz_id: q.id }).catch(() => false);
  if (already) return true;
  if (!q.paystack_public_key) throw new Error('This quiz needs payment, but the creator has not set it up yet.');
  await loadScript('https://js.paystack.co/v1/inline.js');
  return new Promise((resolve, reject) => {
    let handler;
    try {
      handler = PaystackPop.setup({
        key: q.paystack_public_key,
        email: (S.me && S.me.email) || `guest${Date.now()}@quizboot.app`,
        amount: Math.round((+q.price_amount || 0) * 100),
        currency: q.price_currency || 'NGN',
        ref: 'qb_' + String(q.id).slice(0, 8) + '_' + Date.now(),
        callback: res => { rpc('record_paystack_payment', { p_quiz_id: q.id, p_reference: res.reference }).then(() => resolve(true)).catch(reject); },
        onClose: () => reject(new Error('Payment was not completed'))
      });
    } catch (e) { return reject(new Error('Could not start payment: ' + cleanErr(e))); }
    handler.openIframe();
  });
}

ACT['mic-test'] = async btn => {

    const buf = new Float32Array(an.fftSize); let peak = 0; const until = Date.now() + 3000;
    while (Date.now() < until) {

/* ============================================================
   TAKING A QUIZ  (exam engine, anti-cheat, calculator, preview)
   ============================================================ */
const LIVE = new Set();          // attempts started in THIS page load (lost on reload, on purpose)
let T = null;                    // the running session
const CALC = { expr: '', ans: 0, deg: true };

const hasAns = (it, ans) => { const a = ans[it.id]; return Array.isArray(a) ? a.length > 0 : typeof a === 'string' ? a.trim().length > 0 : false; };

function buildLayout(t) {
  const q = t.quiz, sets = t.sets.slice().sort((a, b) => a.position - b.position);
  const order = [], seen = new Set();
  sets.forEach(s => {
    const inSet = t.all.filter(x => x.set_id === s.id).sort((a, b) => a.position - b.position);
    const units = inSet.filter(x => !x.parent_id).map(x => x.type === 'passage' ? [x.id, ...inSet.filter(k => k.parent_id === x.id).map(k => k.id)] : [x.id]);
    (q.shuffle_questions ? shuffle(units) : units).forEach(g => g.forEach(id => { order.push(id); seen.add(id); }));
  });

/* ---------- preview result (local marking) ---------- */
function tkPreviewFinish() {
  const t = T; let sc = 0, tot = 0; const rev = [], bySet = {};
  t.items.forEach(it => {
    const k = t.keys[it.id] || { correct: [], explanation: '' }, a = t.answers[it.id]; let ok = null, mk = 0;
    if (it.type === 'mcq' || it.type === 'tf') { ok = false; if (Array.isArray(a) && a.length) { const s = [...a].sort(), c = [...(k.correct || [])].sort(); ok = s.length === c.length && s.every((x, i) => x === c[i]); } }
    else if (it.type === 'fib') { ok = false; if (typeof a === 'string' && a.trim()) ok = (k.correct || []).some(x => String(x).trim() && String(x).trim().toLowerCase() === a.trim().toLowerCase()); }
    if (ok) mk = +it.marks; tot += +it.marks; sc += mk;
    const b = bySet[it.set_id] || (bySet[it.set_id] = { set_id: it.set_id, name: (t.sets.find(s => s.id === it.set_id) || {}).name || 'General', score: 0, total: 0 }); b.score += mk; b.total += +it.marks;
    rev.push({ question_id: it.id, answer: a === undefined ? null : a, is_correct: ok, marks_awarded: mk, graded: it.type !== 'essay', correct: k.correct, explanation: k.explanation });
  });
  const pct = tot > 0 ? Math.round(sc / tot * 10000) / 100 : 0;

function qModel(quiz, sets, qs, keys) {
  const km = {}; keys.forEach(k => km[k.question_id] = k); const pos = (a, b) => a.position - b.position; let n = 0;
  const groups = sets.slice().sort(pos).map(s => {
    const items = [];
    const push = (x, passage) => {
      n++; const k = km[x.id] || { correct: [], explanation: '' };
      const opts = (x.type === 'mcq' || x.type === 'tf') ? (x.type === 'tf' ? [{ id: 'T', text: 'True' }, { id: 'F', text: 'False' }] : x.options).map((o, i) => ({ letter: LETTERS[i], text: o.text, correct: (k.correct || []).includes(o.id) })) : [];
      items.push({ no: n, type: x.type, body: x.body, marks: +x.marks, opts, answer: x.type === 'fib' ? (k.correct || []).join('  /  ') : opts.filter(o => o.correct).map(o => o.letter).join(', '), expl: k.explanation || '', passage: passage || null });
    };
    qs.filter(x => x.set_id === s.id && !x.parent_id).sort(pos).forEach(x => {
      if (x.type === 'passage') qs.filter(c => c.parent_id === x.id).sort(pos).forEach((c, i) => push(c, i === 0 ? x.body : null)); else push(x, null);
    });

}

  n: { h: 'center', border: 'DAD8EE', fmt: '0.0' }, n2: { h: 'center', border: 'DAD8EE', bg: 'F5F4FC', fmt: '0.0' },
  good: { h: 'center', b: 1, color: '0B7A50', bg: 'E2F7EE', border: 'DAD8EE' }, bad: { h: 'center', b: 1, color: 'B42318', bg: 'FDE9E7', border: 'DAD8EE' }, warn: { h: 'center', b: 1, color: '9A6A00', bg: 'FFF3D6', border: 'DAD8EE' },
  kpi: { b: 1, sz: 20, color: '2A1F8F', h: 'center', bg: 'F5F4FC', border: 'DAD8EE' }, kpil: { color: '6B6A8A', sz: 10, h: 'center', bg: 'F5F4FC', border: 'DAD8EE' },
  lab: { b: 1, color: '4A4870', border: 'DAD8EE', bg: 'F5F4FC' }, val: { border: 'DAD8EE', h: 'left' }, gold: { b: 1, h: 'center', color: '7A5A00', bg: 'FFF0BF', border: 'DAD8EE' }
};
function resultsStats(rows) {
  const done = rows.filter(r => r.score != null), pcts = done.map(r => r.pct);
  return { n: rows.length, done: done.length, auto: rows.filter(r => r.status === 'auto_submitted').length, live: rows.filter(r => r.status === 'ongoing').length, avg: pcts.length ? pcts.reduce((a, b) => a + b, 0) / pcts.length : 0, hi: pcts.length ? Math.max(...pcts) : 0, lo: pcts.length ? Math.min(...pcts) : 0, pass: done.length ? done.filter(r => r.passed).length / done.length * 100 : 0 };
}
function subjectRanks(rows, subNames) {
  const out = {}; subNames.forEach(n => { const sc = rows.map(r => (r.subs.find(x => x.name === n) || {}).score).filter(v => v != null).map(Number); out[n] = v => 1 + sc.filter(x => x > +v).length; }); return out;
}
function buildResultsXlsx(quiz, rows, sets) {
  const st = resultsStats(rows), subNames = []; sets.forEach(s => subNames.push(s.name)); rows.forEach(r => r.subs.forEach(s => { if (!subNames.includes(s.name)) subNames.push(s.name); }));
  const intakeKeys = []; rows.forEach(r => Object.keys(r.intake || {}).forEach(k => { if (!intakeKeys.includes(k)) intakeKeys.push(k); }));
  const sr = subjectRanks(rows, subNames), when = new Date().toLocaleString();
  const S = [];
  // ----- Summary
  const kp = (l, v, s) => [{ v: l, s: 'kpil' }, { v, s: s || 'kpi' }];
  const sum = [[{ v: quiz.title, s: 'title' }], [{ v: `Results report  |  ${when}  |  Quiz key ${String(quiz.share_code).toUpperCase()}`, s: 'sub' }], [],
  [{ v: 'Attempts', s: 'kpil' }, { v: 'Average', s: 'kpil' }, { v: 'Highest', s: 'kpil' }, { v: 'Pass rate', s: 'kpil' }],
  [{ v: st.n, s: 'kpi' }, { v: Math.round(st.avg * 10) / 10 + '%', s: 'kpi' }, { v: Math.round(st.hi * 10) / 10 + '%', s: 'kpi' }, { v: Math.round(st.pass) + '%', s: 'kpi' }],
  [{ v: 'Completed', s: 'kpil' }, { v: 'Auto-submitted', s: 'kpil' }, { v: 'Not finished', s: 'kpil' }, { v: 'Pass mark', s: 'kpil' }],
  [{ v: st.done - st.auto < 0 ? 0 : rows.filter(r => r.status === 'completed').length, s: 'kpi' }, { v: st.auto, s: 'kpi' }, { v: st.live, s: 'kpi' }, { v: quiz.pass_mark + '%', s: 'kpi' }], []];
  const merges = ['A1:F1', 'A2:F2'];
  if (subNames.length > 1) {
    sum.push([{ v: 'By subject', s: 'sec' }]); sum.push([{ v: 'Subject', s: 'hl' }, { v: 'Average %', s: 'h' }, { v: 'Highest %', s: 'h' }, { v: 'Lowest %', s: 'h' }, { v: 'Takers', s: 'h' }]);
    subNames.forEach((n, i) => {
      const ps = rows.map(r => r.subs.find(x => x.name === n)).filter(Boolean).map(x => x.total > 0 ? x.score / x.total * 100 : 0), z = i % 2 ? '2' : '';
      sum.push([{ v: n, s: 't' + z }, { v: ps.length ? Math.round(ps.reduce((a, b) => a + b, 0) / ps.length * 10) / 10 : '', s: 'n' + z }, { v: ps.length ? Math.round(Math.max(...ps) * 10) / 10 : '', s: 'n' + z }, { v: ps.length ? Math.round(Math.min(...ps) * 10) / 10 : '', s: 'n' + z }, { v: ps.length, s: 'c' + z }]);
    });
    sum.push([]);
  }
  sum.push([{ v: 'About this quiz', s: 'sec' }]);
  [['Category', catName(quiz.category)], ['Duration', quiz.duration_min + ' minutes'], ['Questions', quiz.question_count], ['Total marks', num(quiz.total_marks)], ['Created by', '@' + quiz.owner_name], ['Anti-cheat', quiz.anticheat ? 'On' : 'Off'], ['Visibility', quiz.visibility]].forEach(r => sum.push([{ v: r[0], s: 'lab' }, { v: r[1], s: 'val' }, null]));
  S.push({ name: 'Summary', rows: sum, widths: [24, 18, 18, 18, 14, 14], merges, heights: { 0: 34, 4: 36, 6: 36 }, tab: '7A69F0' });
  // ----- Results
  const head = ['Rank', 'Username', 'Guest', 'Status', 'Ended because', 'Score', 'Total', '%', 'Result', 'Time used', 'Started', 'Submitted'];
  subNames.forEach(n => { head.push(n + ' score', n + ' rank'); });
  head.push('Anti-cheat flags', 'Anti-cheat log', ...intakeKeys);
  const data = [head.map((h, i) => ({ v: h, s: i === 1 ? 'hl' : 'h' }))]; let rank = 0;
  rows.forEach((r, i) => {
    const z = i % 2 ? '2' : ''; const stS = r.status === 'completed' ? 'good' : r.status === 'auto_submitted' ? 'bad' : 'warn';
    const row = [{ v: r.score != null ? ++rank : '', s: rank <= 3 && r.score != null ? 'gold' : 'c' + z }, { v: r.name, s: 't' + z }, { v: r.guest ? 'Yes' : 'No', s: 'c' + z }, { v: statusLbl(r), s: stS }, { v: (r.reason || '').replace(/^anticheat:/, 'Anti-cheat: ').replace('time_up', 'Time up'), s: 't' + z },
    { v: r.score != null ? r.score : '', s: 'c' + z }, { v: r.total != null ? r.total : '', s: 'c' + z }, { v: r.pct != null ? Math.round(r.pct * 10) / 10 : '', s: 'n' + z }, { v: r.passed == null ? '' : (r.passed ? 'Passed' : 'Failed'), s: r.passed == null ? 'c' + z : (r.passed ? 'good' : 'bad') },
    { v: r.time != null ? fmtDur(r.time) : '', s: 'c' + z }, { v: r.started ? new Date(r.started).toLocaleString() : '', s: 'c' + z }, { v: r.submitted ? new Date(r.submitted).toLocaleString() : '', s: 'c' + z }];
    subNames.forEach(n => { const s = r.subs.find(x => x.name === n); row.push({ v: s ? `${num(s.score)} / ${num(s.total)}` : '', s: 'c' + z }, { v: s ? sr[n](s.score) : '', s: 'c' + z }); });
    row.push({ v: r.cheats || 0, s: r.cheats ? 'bad' : 'c' + z }, { v: r.cheatLog.filter(c => c.n).map(c => c.r).join('; '), s: 't' + z });
    intakeKeys.forEach(k => row.push({ v: (r.intake || {})[k] || '', s: 't' + z }));
    data.push(row);
  });
  const widths = [7, 22, 8, 16, 26, 8, 8, 8, 10, 11, 20, 20]; subNames.forEach(() => widths.push(13, 8)); widths.push(11, 34); intakeKeys.forEach(() => widths.push(24));
  S.push({ name: 'Results', rows: data, widths, freeze: 1, filter: `A1:${colName(head.length - 1)}${Math.max(2, data.length)}`, heights: { 0: 34 }, tab: '2A1F8F' });
  return xlsxBuild(S, XS);
}
function resultsHtml(quiz, rows, sets) {
  const st = resultsStats(rows), subNames = []; sets.forEach(s => subNames.push(s.name)); rows.forEach(r => r.subs.forEach(s => { if (!subNames.includes(s.name)) subNames.push(s.name); }));
  const sr = subjectRanks(rows, subNames); let rank = 0;
  const trs = rows.map(r => { const k = r.score != null ? ++rank : '-'; return `<tr><td>${k}</td><td><b>${esc(r.name)}</b>${r.guest ? ' (guest)' : ''}</td><td>${r.score != null ? num(r.score) + '/' + num(r.total) : '-'}</td><td class="${r.passed ? 'g' : r.passed === false ? 'r' : ''}">${r.pct != null ? num(r.pct, 1) + '%' : '-'}</td><td class="${r.status === 'completed' ? 'g' : r.status === 'auto_submitted' ? 'r' : 'w'}">${statusLbl(r)}</td><td>${r.time != null ? fmtDur(r.time) : '-'}</td>${subNames.length > 1 ? `<td>${r.subs.map(s => `${esc(s.name)} ${num(s.score)}/${num(s.total)} (#${sr[s.name] ? sr[s.name](s.score) : '-'})`).join('<br>')}</td>` : ''}</tr>`; }).join('');
  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(quiz.title)} results</title><style>${PRINT_CSS}@page{size:A4 landscape}</style></head><body><h1>${esc(quiz.title)}</h1><div class="meta">Results report &nbsp;|&nbsp; ${new Date().toLocaleString()} &nbsp;|&nbsp; Quiz key ${esc(String(quiz.share_code).toUpperCase())}</div>
  <div class="kpis"><div class="kpi"><b>${st.n}</b><span>Attempts</span></div><div class="kpi"><b>${num(st.avg, 1)}%</b><span>Average</span></div><div class="kpi"><b>${num(st.hi, 1)}%</b><span>Highest</span></div><div class="kpi"><b>${num(st.pass, 0)}%</b><span>Pass rate</span></div></div>
  <table class="t"><thead><tr><th>#</th><th>Name</th><th>Score</th><th>%</th><th>Status</th><th>Time</th>${subNames.length > 1 ? '<th>By subject (rank)</th>' : ''}</tr></thead><tbody>${trs}</tbody></table><div class="foot">Made with QuizBuilt</div></body></html>`;
}

/* ---------- export sheets ---------- */
ACT['q-exportq'] = () => {
  openSheet(`<h3 class="h2">Export questions</h3><p class="mut sm gap0">Only you can do this. Pick a format.</p>
    ${swRow('ex-ans', 'Include answers and explanations', 'Turn off to make a clean student copy for printing.', true)}
    <div class="tiles gap0"><button class="tile" data-act="exq" data-f="pdf">${ic('file', 22)}PDF<small class="mut" style="font-weight:500">Print / save as PDF</small></button><button class="tile" data-act="exq" data-f="docx">${ic('edit', 22)}Word<small class="mut" style="font-weight:500">Editable .docx</small></button>
    <button class="tile" data-act="exq" data-f="txt">${ic('list', 22)}Text<small class="mut" style="font-weight:500">Re-importable .txt</small></button><button class="tile" data-act="exq" data-f="json">${ic('download', 22)}JSON<small class="mut" style="font-weight:500">Raw data</small></button></div>`);
};
async function loadQuizContent(q) {
  const [sets, qs, keys] = await Promise.all([db(sb.from('question_sets').select('*').eq('quiz_id', q.id).order('position')), db(sb.from('questions').select('*').eq('quiz_id', q.id).order('position')), db(sb.from('question_keys').select('*').eq('quiz_id', q.id))]);
  return { sets, qs, keys };
}
ACT.exq = async el => {
  const q = Q.quiz, f = el.dataset.f, withAns = $('#ex-ans') ? $('#ex-ans').checked : true; busy(el, true);
  try {
    const { sets, qs, keys } = await loadQuizContent(q); const fname = q.title.replace(/[^\w]+/g, '_').replace(/^_|_$/g, '').slice(0, 40) || 'quiz'; const km = {}; keys.forEach(k => km[k.question_id] = k);
    if (f === 'json') { download(fname + '.json', JSON.stringify({ quiz: { title: q.title, description: q.description, duration_min: q.duration_min }, sets, questions: qs.map(x => Object.assign({}, x, { key: km[x.id] || null })) }, null, 2), 'application/json'); }
    else if (f === 'docx') { const m = qModel(q, sets, qs, keys); download(fname + (withAns ? '_with_answers' : '_student_copy') + '.docx', questionsDocx(q, m, withAns)); toast('Word file downloaded', 'ok'); }
    else if (f === 'pdf') { const m = qModel(q, sets, qs, keys); printHtml(questionsHtml(q, m, withAns), fname + (withAns ? '_with_answers' : '_student_copy')); toast('Choose "Save as PDF" in the print window'); }
    else {
      let out = '', n = 0;
      sets.forEach(s => {
        out += `[Section: ${s.name}]\n\n`;
        const emit = x => {
          n++; const k = km[x.id] || { correct: [], explanation: '' }; out += `${n}. ${htmlToPlain(x.body)}\n`;
          if (x.type === 'mcq' || x.type === 'tf') { x.options.forEach((o, i) => { out += `${LETTERS[i]}. ${htmlToPlain(o.text)}\n`; }); const ls = x.options.map((o, i) => (k.correct || []).includes(o.id) ? LETTERS[i] : '').filter(Boolean); if (ls.length && withAns) out += `Answer: ${ls.join(', ')}\n`; }
          else if (x.type === 'fib' && withAns) out += `Answer: ${(k.correct || []).join(' | ')}\n`;
          out += `Marks: ${x.marks}\n`; if (k.explanation && withAns) out += `Explanation: ${htmlToPlain(k.explanation)}\n`; out += '\n';
        };
        qs.filter(x => x.set_id === s.id && !x.parent_id).forEach(x => { if (x.type === 'passage') { out += `[Passage]\n${htmlToPlain(x.body)}\n`; qs.filter(k => k.parent_id === x.id).forEach(emit); out += '[End Passage]\n\n'; } else emit(x); });
      });
      download(fname + '.txt', out, 'text/plain');
    }
    if (f !== 'pdf') closeSheet();
  } finally { busy(el, false); }
};
ACT['or-xlsx'] = async btn => {
  busy(btn, true);
  try {
    const q = OR.quiz, fname = (q.title.replace(/[^\w]+/g, '_').replace(/^_|_$/g, '').slice(0, 40) || 'quiz') + '_results';
    download(fname + '.xlsx', buildResultsXlsx(q, OR.rows, OR.sets)); toast('Spreadsheet downloaded', 'ok');
  } finally { busy(btn, false); }
};
ACT['or-pdf'] = () => { const q = OR.quiz; printHtml(resultsHtml(q, OR.rows, OR.sets), (q.title.replace(/[^\w]+/g, '_').slice(0, 40) || 'quiz') + '_results'); toast('Choose "Save as PDF" in the print window'); };
